<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jimmy VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: rgba(255,255,255,.04);
            --card-border: rgba(255,255,255,.07);
            --card-border-hover: rgba(255,255,255,.14);
            --text: #f0f0f5;
            --muted: rgba(255,255,255,.38);
            --success: #3dd68c;
            --danger: #ff5f57;
            --accent: #6c6fff;
            --accent-dim: rgba(108,111,255,.15);
            --trial: #f59e0b;
            --trial-dim: rgba(245,158,11,.12);
        }
        .tg-light {
            --bg: #f2f2f7;
            --card: rgba(0,0,0,.04);
            --card-border: rgba(0,0,0,.08);
            --card-border-hover: rgba(0,0,0,.15);
            --text: #0a0a0f;
            --muted: rgba(0,0,0,.4);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent; }
        html { height: 100%; }
        body { background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, sans-serif;
            min-height: 100vh; overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom); }

        /* ── Shimmer skeleton ─────────────────── */
        @keyframes shimmer {
            0%   { background-position: -400px 0; }
            100% { background-position: 400px 0; }
        }
        .skel { background: linear-gradient(90deg,
            rgba(255,255,255,.04) 0%, rgba(255,255,255,.10) 50%, rgba(255,255,255,.04) 100%);
            background-size: 800px 100%;
            animation: shimmer 1.4s infinite linear;
            border-radius: 8px; }

        /* ── Layout ───────────────────────────── */
        .wrapper { max-width: 420px; margin: 0 auto;
            padding: 16px 14px 32px; display: flex; flex-direction: column; gap: 10px; }

        /* ── Cards ────────────────────────────── */
        .card { background: var(--card); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 16px;
            transition: border-color .25s; }

        /* ── Header card ──────────────────────── */
        .hcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .hcard-left { display: flex; align-items: center; gap: 12px; }
        .logo { width: 44px; height: 44px; border-radius: 12px; overflow: hidden;
            background: #111; border: 1px solid rgba(255,255,255,.07); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
        .status-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .dot-on  { background: var(--success); box-shadow: 0 0 8px var(--success);
            animation: pulse-dot 2s infinite; }
        .dot-off { background: var(--danger); }
        .dot-trial { background: var(--trial); box-shadow: 0 0 8px var(--trial);
            animation: pulse-dot 2s infinite; }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.35} }
        .status-text { font-size: 12px; font-weight: 500; }
        .exp-badge { display: inline-flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
            border-radius: 8px; padding: 5px 9px; font-size: 11px; color: var(--muted);
            margin-top: 8px; }
        .exp-badge b { color: var(--text); }

        /* Trial badge */
        .trial-banner { background: var(--trial-dim); border: 1px solid rgba(245,158,11,.25);
            border-radius: 12px; padding: 10px 14px;
            display: flex; align-items: center; gap: 10px; }
        .trial-banner .ti { font-size: 18px; flex-shrink: 0; }
        .trial-banner h4 { font-size: 13px; font-weight: 700; color: var(--trial); }
        .trial-banner p { font-size: 11px; color: var(--muted); margin-top: 2px; }

        /* ── Metrics ──────────────────────────── */
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric-card { background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px; }
        .mlabel { font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
            text-transform: uppercase; color: var(--muted); }
        .mvalue { font-size: 26px; font-weight: 800; letter-spacing: -.8px; margin-top: 6px; }
        .munit  { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .traffic-row { display: flex; justify-content: space-between;
            font-size: 12px; font-weight: 600; margin-top: 8px; }
        .traffic-row span:first-child { color: var(--muted); }
        .tbar { height: 3px; border-radius: 100px; background: rgba(255,255,255,.06);
            overflow: hidden; margin-top: 5px; }
        .tbar-fill { height: 100%; border-radius: 100px; width: 0;
            transition: width 1.1s cubic-bezier(.34,1.2,.64,1); }
        .tbar-up { background: linear-gradient(90deg,#2980b9,#74b9e8); }
        .tbar-dn { background: linear-gradient(90deg,#27ae60,#58d68d); }

        /* ── Expired ──────────────────────────── */
        .expired-card { background: rgba(255,95,87,.06); border: 1px solid rgba(255,95,87,.18);
            border-radius: 18px; padding: 20px; text-align: center; }
        .expired-card .eicon { font-size: 36px; margin-bottom: 10px; }
        .expired-card h3 { font-size: 16px; font-weight: 800; color: var(--danger); }
        .expired-card p  { font-size: 13px; color: var(--muted); margin-top: 6px; }

        /* ── Sub key card ─────────────────────── */
        .key-card { cursor: pointer; }
        .key-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .key-mono { font-family: ui-monospace, 'SF Mono', monospace; font-size: 12px;
            color: var(--muted); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; margin-top: 5px;
            transition: color .2s; max-width: calc(100% - 30px); }
        .key-mono.shown { color: var(--text); }
        .key-actions { display: flex; gap: 8px; margin-top: 12px; }
        .key-btn { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--card-border);
            background: rgba(255,255,255,.04); color: var(--text); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: background .2s, border-color .2s;
            display: flex; align-items: center; justify-content: center; gap: 6px; }
        .key-btn:active { background: rgba(255,255,255,.09); border-color: var(--card-border-hover); }

        /* ── Menu items ───────────────────────── */
        .menu { display: flex; flex-direction: column; gap: 8px; }
        .mi { display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; cursor: pointer;
            transition: border-color .2s, background .2s; }
        .mi:active { background: rgba(255,255,255,.07); border-color: var(--card-border-hover); }
        .mi-left { display: flex; align-items: center; gap: 12px; }
        .mi-icon { width: 34px; height: 34px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .mi h4 { font-size: 14px; font-weight: 600; }
        .mi .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .chevron { color: var(--muted); }

        .mi-accent { border-color: rgba(108,111,255,.25); background: var(--accent-dim); }
        .mi-accent h4 { color: #a5a7ff; }
        .mi-accent .mi-icon { background: rgba(108,111,255,.15); }
        .mi-accent:active { border-color: rgba(108,111,255,.45); }

        .mi-support { border-color: rgba(61,214,140,.2); background: rgba(61,214,140,.06); }
        .mi-support h4 { color: var(--success); }
        .mi-support .mi-icon { background: rgba(61,214,140,.1); }

        .mi-danger { border-color: rgba(255,95,87,.2); background: rgba(255,95,87,.06); }
        .mi-danger h4 { color: var(--danger); }
        .mi-danger .mi-icon { background: rgba(255,95,87,.1); }

        /* ── Tabs ─────────────────────────────── */
        .tabs { display: flex; gap: 5px; background: rgba(255,255,255,.04);
            border: 1px solid var(--card-border); border-radius: 14px; padding: 4px; }
        .tab-btn { flex: 1; padding: 9px; border: none; background: transparent;
            color: var(--muted); font-size: 13px; font-weight: 600;
            border-radius: 10px; cursor: pointer; transition: all .2s; }
        .tab-btn.active { background: rgba(255,255,255,.09); color: var(--text); }
        .tab-content { display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }

        /* ── Instruction ──────────────────────── */
        .instr-step { display: flex; gap: 12px; align-items: flex-start;
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 14px; }
        .instr-num { width: 28px; height: 28px; border-radius: 50%;
            background: var(--accent-dim); border: 1px solid rgba(108,111,255,.3);
            color: #a5a7ff; display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; flex-shrink: 0; }
        .instr-text h4 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .instr-text p  { font-size: 12px; color: var(--muted); line-height: 1.65; }
        .platform-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .pbadge { padding: 6px 12px; border: 1px solid var(--card-border);
            border-radius: 8px; font-size: 12px; color: var(--muted); cursor: pointer;
            transition: background .2s, border-color .2s; }
        .pbadge:active { background: rgba(255,255,255,.07); border-color: var(--card-border-hover); }

        /* ── Sync button ──────────────────────── */
        .btn-sync { background: transparent; border: 1px solid var(--card-border);
            color: var(--muted); border-radius: 14px; padding: 13px;
            font-size: 13px; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            width: 100%; transition: background .2s, border-color .2s, color .2s; }
        .btn-sync:active { background: var(--card); color: var(--text); border-color: var(--card-border-hover); }
        .spin-icon { transition: transform .6s ease; }
        .spinning { transform: rotate(360deg); }

        /* ── Renew btn ────────────────────────── */
        .btn-renew { width: 100%; margin-top: 14px; padding: 14px;
            background: linear-gradient(135deg, var(--danger), #c0392b);
            border: none; color: #fff; border-radius: 14px;
            font-size: 14px; font-weight: 700; cursor: pointer;
            box-shadow: 0 4px 24px rgba(255,95,87,.25); }

        /* ── Toast ────────────────────────────── */
        .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom));
            left: 50%; transform: translateX(-50%) translateY(80px);
            background: rgba(20,20,30,.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.1); color: var(--text);
            padding: 11px 22px; border-radius: 100px; font-size: 13px; font-weight: 600;
            transition: transform .3s cubic-bezier(.34,1.4,.64,1);
            white-space: nowrap; z-index: 999; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── QR modal ─────────────────────────── */
        .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.8);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity .25s; }
        .qr-modal.show { opacity: 1; pointer-events: all; }
        .qr-box { background: #fff; border-radius: 20px; padding: 24px;
            display: flex; flex-direction: column; align-items: center; gap: 14px;
            transform: scale(.9); transition: transform .25s; }
        .qr-modal.show .qr-box { transform: scale(1); }
        .qr-box p { color: #333; font-size: 13px; text-align: center; }
        .qr-close { background: #111; color: #fff; border: none; border-radius: 12px;
            padding: 11px 28px; font-size: 14px; font-weight: 700; cursor: pointer; }

        /* ── Stranger ─────────────────────────── */
        .stranger { min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
        .stranger-glow { width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,95,87,.25) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            font-size: 46px; margin-bottom: 20px;
            animation: bobble 3s ease-in-out infinite; }
        @keyframes bobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        .stranger h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .stranger p  { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 280px; }
        .step-list { margin: 20px 0; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 300px; }
        .step { display: flex; align-items: center; gap: 12px;
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 12px 14px; text-align: left; }
        .step-num { width: 24px; height: 24px; border-radius: 50%;
            background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
        .step span { font-size: 13px; color: var(--muted); }
        .step b { color: var(--text); }
        .btn-open { width: 100%; max-width: 280px; padding: 15px;
            background: linear-gradient(135deg,#2980b9,#5dade2);
            border: none; color: #fff; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
            box-shadow: 0 4px 20px rgba(41,128,185,.3); }

        /* ── Fade-in entrance ─────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .anim { opacity: 0; animation: fadeUp .4s ease forwards; }
        .d1 { animation-delay: .05s; } .d2 { animation-delay: .12s; }
        .d3 { animation-delay: .19s; } .d4 { animation-delay: .26s; }
        .d5 { animation-delay: .33s; } .d6 { animation-delay: .40s; }
    </style>
</head>
<body>
<div class="wrapper" id="root"></div>
<div class="toast" id="toast"></div>
<div class="qr-modal" id="qrModal" onclick="hideQR()">
    <div class="qr-box" onclick="event.stopPropagation()">
        <div id="qrcode"></div>
        <p>Отсканируйте с другого устройства</p>
        <button class="qr-close" onclick="hideQR()">Закрыть</button>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

// Тема Telegram
if (tg.colorScheme === 'light') document.documentElement.classList.add('tg-light');

const p       = new URLSearchParams(window.location.search);
const sub     = p.get('sub')     || '';
const days    = parseInt(p.get('days') ?? '-1');
const upStr   = p.get('up')     || '0 Б';
const dnStr   = p.get('down')   || '0 Б';
const active  = p.get('active') === '1';
const trial   = p.get('trial')  === '1';
const expDate = p.get('exp')    || '';
const root    = document.getElementById('root');

let keyShown = false;
let _qrGen   = false;

// ── Helpers ─────────────────────────────────────────────────────────────────
function showToast(msg, ms=2400){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), ms);
}

function haptic(type='light'){
    try{ tg.HapticFeedback.impactOccurred(type); }catch(e){}
}

function switchTab(name){
    haptic('light');
    try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
    document.querySelectorAll('.tab-btn').forEach((b,i)=>{
        b.classList.toggle('active', (i===0&&name==='key')||(i===1&&name==='instr'));
    });
    document.getElementById('tab-key').classList.toggle('active', name==='key');
    document.getElementById('tab-instr').classList.toggle('active', name==='instr');
}

// ── Open in v2ray ────────────────────────────────────────────────────────────
function openInV2ray(){
    if(!sub) return;
    haptic('medium');
    // Пробуем несколько схем для Android и iOS
    const schemes = [
        'v2rayng://install-config?url=' + encodeURIComponent(sub),
        'v2raytun://install-config?url=' + encodeURIComponent(sub),
    ];
    let tried = 0;
    function tryNext(){
        if(tried >= schemes.length){ showToast('Установите v2rayNG/v2rayTun'); return; }
        const a = document.createElement('a');
        a.href = schemes[tried++];
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
    tryNext();
    showToast('📡 Открываем приложение...');
}

// ── Copy ─────────────────────────────────────────────────────────────────────
function copyKey(){
    if(!sub) return;
    function doWrite(){
        haptic('medium');
        showToast('✓ Скопировано');
    }
    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(sub).then(doWrite).catch(()=>{ fb(); doWrite(); });
    } else {
        const t=document.createElement('textarea');
        t.value=sub; t.style.cssText='position:fixed;opacity:0';
        document.body.appendChild(t); t.focus(); t.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(t);
        doWrite();
    }
}

// ── Toggle key visibility ─────────────────────────────────────────────────────
function toggleKey(){
    keyShown = !keyShown;
    haptic('light');
    const el = document.getElementById('keyEl');
    const btnTxt = document.getElementById('keyToggleTxt');
    if(!el) return;
    if(keyShown){
        el.textContent = sub;
        el.classList.add('shown');
        if(btnTxt) btnTxt.textContent = '🙈 Скрыть';
    } else {
        el.textContent = '••••••••••••••••••••••••••••••••••';
        el.classList.remove('shown');
        if(btnTxt) btnTxt.textContent = '👁 Показать';
    }
}

// ── QR ───────────────────────────────────────────────────────────────────────
function showQR(){
    if(!sub) return;
    haptic('light');
    const modal = document.getElementById('qrModal');
    if(!_qrGen){
        new QRCode(document.getElementById('qrcode'),{
            text: sub, width: 200, height: 200,
            colorDark:'#000000', colorLight:'#ffffff',
            correctLevel: QRCode.CorrectLevel.M
        });
        _qrGen = true;
    }
    modal.classList.add('show');
}
function hideQR(){
    document.getElementById('qrModal').classList.remove('show');
}

// ── Renew / Support / Sync ────────────────────────────────────────────────────
function renewSub(){
    haptic('light');
    tg.sendData('renew');
}
function openSupport(){
    haptic('light');
    tg.openTelegramLink('https://t.me/jimmy_vpn_support');
    setTimeout(()=>tg.close(), 400);
}
function syncData(){
    haptic('light');
    const s = document.getElementById('syncSvg');
    if(s) s.classList.add('spinning');
    setTimeout(()=>{
        if(s) s.classList.remove('spinning');
        tg.sendData('refresh');
    }, 500);
}

// ── Render ───────────────────────────────────────────────────────────────────
if(!sub){
    const fromBot = tg.initData && tg.initData.length > 0;
    root.innerHTML = `
    <div class="stranger">
        <div class="stranger-glow">🔒</div>
        <h1>${fromBot ? 'Ключ не найден' : 'Доступ закрыт'}</h1>
        <p>${fromBot
            ? 'У вас ещё нет активного ключа.<br>Оформите подписку в боте.'
            : 'Это личный кабинет сервиса <b>Jimmy VPN</b>.<br>Открывайте только через бот.'
        }</p>
        <div class="step-list">
            <div class="step"><div class="step-num">1</div><span>Откройте <b>@Jimmy_Vpn_bot</b></span></div>
            <div class="step"><div class="step-num">2</div><span>Нажмите <b>👤 Личный кабинет</b></span></div>
            <div class="step"><div class="step-num">3</div><span>Нажмите <b>📡 Подключить</b></span></div>
        </div>
        <button class="btn-open" onclick="tg.close()">${fromBot ? '← Вернуться в бот' : '← Открыть бот'}</button>
    </div>`;
} else {

    // Статус
    let dotClass = 'dot-off', statusColor = 'var(--danger)', statusText = 'Подписка отключена';
    if(trial){ dotClass='dot-trial'; statusColor='var(--trial)'; statusText='🎁 Пробный период'; }
    else if(active){ dotClass='dot-on'; statusColor='var(--success)'; statusText='Подписка активна'; }

    const expBlock = expDate ? `<div class="exp-badge">📅 До <b>${expDate}</b></div>` : '';

    const trialBanner = trial ? `
    <div class="trial-banner anim d2">
        <div class="ti">🎁</div>
        <div>
            <h4>Пробный период</h4>
            <p>Это тестовый доступ. Оформите подписку чтобы продолжить пользоваться VPN.</p>
        </div>
    </div>` : '';

    const metricsBlock = days < 0
        ? `<div class="expired-card anim d3">
            <div class="eicon">⚠️</div>
            <h3>Подписка истекла</h3>
            <p>Пополните баланс для продления</p>
            <button class="btn-renew" onclick="renewSub()">💳 Продлить подписку</button>
           </div>`
        : `<div class="metrics anim d3">
            <div class="metric-card">
                <div class="mlabel">Осталось</div>
                <div class="mvalue">${days}</div>
                <div class="munit">дней</div>
            </div>
            <div class="metric-card">
                <div class="mlabel">Трафик</div>
                <div class="traffic-row"><span>↑</span><span>${upStr}</span></div>
                <div class="tbar"><div class="tbar-fill tbar-up" id="bU"></div></div>
                <div class="traffic-row" style="margin-top:6px"><span>↓</span><span>${dnStr}</span></div>
                <div class="tbar"><div class="tbar-fill tbar-dn" id="bD"></div></div>
            </div>
