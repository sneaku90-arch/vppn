<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jimmy VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --card: rgba(255,255,255,.04);
  --card-border: rgba(255,255,255,.07);
  --card-hover: rgba(255,255,255,.07);
  --text: #f0f0f5;
  --muted: rgba(255,255,255,.4);
  --green: #00e676;
  --red: #ff4d6d;
  --blue: #5b8def;
  --gold: #ffc107;
  --accent: #7c6ef5;
  --accent2: #5b8def;
}
.tg-light {
  --bg: #f2f2f7;
  --card: rgba(0,0,0,.04);
  --card-border: rgba(0,0,0,.08);
  --card-hover: rgba(0,0,0,.07);
  --text: #111118;
  --muted: rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:32px}

/* Animated background */
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(80px);opacity:.15;animation:orb-float 8s ease-in-out infinite}
.bg-orb1{width:300px;height:300px;background:var(--accent);top:-100px;right:-100px;animation-delay:0s}
.bg-orb2{width:200px;height:200px;background:var(--blue);bottom:100px;left:-80px;animation-delay:3s}
@keyframes orb-float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-20px) scale(1.05)}}

.wrapper{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:16px}

/* Tabs */
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:4px;margin-bottom:14px}
.tab{flex:1;padding:9px 4px;border:none;background:none;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;border-radius:10px;cursor:pointer;transition:all .25s;white-space:nowrap}
.tab.on{background:var(--card-hover);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.page{display:none;flex-direction:column;gap:12px;animation:fadeUp .3s ease}
.page.on{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:16px;transition:border-color .2s}
.card:active{border-color:var(--card-hover)}

/* Header card */
.hdr{display:flex;justify-content:space-between;align-items:flex-start}
.hdr-left{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.logo-fb{width:44px;height:44px;border-radius:12px;background:#1a1a2e;border:1px solid #222;display:flex;align-items:center;justify-content:center;font-size:22px}
.brand{font-size:16px;font-weight:700;letter-spacing:-.3px}
.status-row{display:flex;align-items:center;gap:6px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot-on{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse-dot 2s infinite}
.dot-off{background:var(--red)}
@keyframes pulse-dot{0%,100%{opacity:1;box-shadow:0 0 8px var(--green)}50%{opacity:.5;box-shadow:0 0 3px var(--green)}}
.status-txt{font-size:12px;font-weight:600}
.trial-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,193,7,.1);border:1px solid rgba(255,193,7,.3);color:var(--gold);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;margin-top:4px}
.bal{font-size:22px;font-weight:800;letter-spacing:-.5px;white-space:nowrap}

/* Exp badge */
.exp-badge{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);margin-top:10px}
.exp-badge b{color:var(--text)}

/* Metrics */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.big-num{font-size:26px;font-weight:800;letter-spacing:-.5px}
.unit{font-size:12px;color:var(--muted);margin-top:2px}
.tr-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-top:8px}
.tr-bar{height:3px;background:rgba(255,255,255,.06);border-radius:100px;margin-top:5px;overflow:hidden}
.tr-fill{height:100%;border-radius:100px;width:0;transition:width 1.2s cubic-bezier(.34,1.2,.64,1)}
.fill-up{background:linear-gradient(90deg,var(--blue),#74b9ff)}
.fill-dn{background:linear-gradient(90deg,var(--green),#69ff9c)}

/* Key card */
.key-card{cursor:pointer}
.key-top{display:flex;justify-content:space-between;align-items:center}
.key-actions{display:flex;gap:8px}
.icon-btn{width:32px;height:32px;border:1px solid var(--card-border);border-radius:8px;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s}
.icon-btn:active{background:var(--card-hover)}
.key-data{font-family:'Courier New',monospace;font-size:11px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s;line-height:1.5}
.key-data.revealed{color:var(--text);white-space:normal;word-break:break-all}

/* Menu items */
.menu{display:flex;flex-direction:column;gap:8px}
.mi{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.mi:active{background:var(--card-hover);transform:scale(.99)}
.mi-left{display:flex;align-items:center;gap:12px}
.mi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mi h4{font-size:14px;font-weight:600}
.mi .sub{font-size:11px;color:var(--muted);margin-top:1px}
.mi-accent{border-color:rgba(124,110,245,.3);background:rgba(124,110,245,.05)}
.mi-accent h4{color:#b0a8ff}
.mi-accent .mi-icon{background:rgba(124,110,245,.15)}
.mi-support .mi-icon{background:rgba(91,141,239,.12)}
.mi-support h4{color:#8ab4f8}
.chev{color:var(--muted);font-size:16px;flex-shrink:0}

/* Refresh btn */
.btn-refresh{width:100%;padding:14px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;color:var(--muted);font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
.btn-refresh:active{background:var(--card-hover);color:var(--text)}
.spin{display:inline-block;transition:transform .6s}
.spinning{transform:rotate(360deg)}

/* Instruction */
.step{display:flex;gap:12px;padding:14px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;animation:fadeUp .4s ease both}
.step:nth-child(2){animation-delay:.05s}
.step:nth-child(3){animation-delay:.1s}
.step:nth-child(4){animation-delay:.15s}
.step:nth-child(5){animation-delay:.2s}
.step-n{width:30px;height:30px;border-radius:50%;background:rgba(124,110,245,.12);border:1px solid rgba(124,110,245,.25);color:#b0a8ff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.step-body h4{font-size:13px;font-weight:700;margin-bottom:3px}
.step-body p{font-size:12px;color:var(--muted);line-height:1.7}
.dl-row{display:flex;gap:8px;margin-top:8px}
.dl-btn{padding:6px 12px;border:1px solid var(--card-border);border-radius:9px;background:none;color:var(--muted);font-family:'Outfit',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.dl-btn:active{background:var(--card-hover);color:var(--text)}

/* Payment history */
.pay-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--card-border)}
.pay-item:last-child{border-bottom:none}
.pay-left{display:flex;align-items:center;gap:10px}
.pay-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pay-date{font-size:12px;color:var(--muted);margin-top:2px}
.pay-amt{font-size:16px;font-weight:700;color:var(--green)}
.empty-hist{text-align:center;padding:32px 0;color:var(--muted);font-size:13px}

/* QR modal */
.qr-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.qr-overlay.show{opacity:1;pointer-events:all}
.qr-box{background:#fff;border-radius:20px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px;transform:scale(.9);transition:transform .3s}
.qr-overlay.show .qr-box{transform:scale(1)}
.qr-box p{color:#333;font-size:12px;text-align:center;max-width:180px;line-height:1.6}
.qr-close{background:#111;color:#fff;border:none;border-radius:12px;padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif}

/* Stranger screen */
.stranger{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px}
.stranger-icon{font-size:64px;margin-bottom:20px;animation:orb-float 3s ease-in-out infinite}
.stranger h1{font-size:24px;font-weight:800;margin-bottom:10px}
.stranger p{font-size:14px;color:var(--muted);line-height:1.7;max-width:280px}
.stranger-steps{margin:24px 0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px}
.s-step{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:12px 14px;text-align:left}
.s-num{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0}
.s-step span{font-size:13px;color:var(--muted)}
.s-step b{color:var(--text)}
.btn-primary{width:100%;max-width:300px;padding:15px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif;box-shadow:0 4px 20px rgba(124,110,245,.3)}

/* Toast */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.25);color:var(--green);padding:11px 22px;border-radius:100px;font-size:13px;font-weight:700;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;z-index:999;font-family:'Outfit',sans-serif}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Expired block */
.expired-card{background:rgba(255,77,109,.06);border:1px solid rgba(255,77,109,.2);border-radius:18px;padding:20px;text-align:center}
.expired-card .ei{font-size:36px;margin-bottom:8px}
.expired-card h3{font-size:15px;font-weight:700;color:var(--red);margin-bottom:6px}
.expired-card p{font-size:13px;color:var(--muted)}
.btn-renew{width:100%;margin-top:14px;padding:14px;background:linear-gradient(135deg,var(--red),#c0392b);border:none;color:#fff;border-radius:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Outfit',sans-serif}
</style>
</head>
<body>
<div class="bg-orb bg-orb1"></div>
<div class="bg-orb bg-orb2"></div>
<div class="wrapper" id="root"></div>
<div class="toast" id="toast"></div>
<div class="qr-overlay" id="qrOverlay" onclick="hideQR()">
  <div class="qr-box" onclick="event.stopPropagation()">
    <div id="qrcode"></div>
    <p>Отсканируйте с другого устройства в v2rayTun</p>
    <button class="qr-close" onclick="hideQR()">Закрыть</button>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

// Тема Telegram
if(tg.colorScheme === 'light') document.documentElement.classList.add('tg-light');

const p = new URLSearchParams(window.location.search);
const sub     = p.get('sub') || '';
const days    = parseInt(p.get('days') ?? '-1');
const upStr   = p.get('up')   || '0 Б';
const dnStr   = p.get('down') || '0 Б';
const active  = p.get('active') === '1';
const bal     = p.get('balance') || '0';
const expDate = p.get('exp') || '';
const isTrial = p.get('trial') === '1';
const histRaw = p.get('hist') || '';
const isFromBot = tg.initData && tg.initData.length > 0;
const root = document.getElementById('root');

// История платежей
const payments = histRaw ? histRaw.split(',').map(r => {
  const [date, amount, type] = r.split('|');
  return { date, amount, type };
}) : [];

if (!sub) {
  root.innerHTML = `
    <div class="stranger">
      <div class="stranger-icon">🔒</div>
      <h1>${isFromBot ? 'Ключ не найден' : 'Доступ закрыт'}</h1>
      <p>${isFromBot ? 'У вас ещё нет активного ключа.<br>Оформите подписку в боте.' : 'Это личный кабинет <b>Jimmy VPN</b>.<br>Открывайте только через бот.'}</p>
      <div class="stranger-steps">
        <div class="s-step"><div class="s-num">1</div><span>Откройте <b>@Jimmy_Vpn_bot</b></span></div>
        <div class="s-step"><div class="s-num">2</div><span>Нажмите <b>👤 Личный кабинет</b></span></div>
        <div class="s-step"><div class="s-num">3</div><span>Откройте <b>🚀 Личный кабинет</b></span></div>
      </div>
      <button class="btn-primary" onclick="tg.close()">← Открыть бот</button>
    </div>`;
} else {
  const expBlock = expDate ? `<div class="exp-badge">📅 До <b>${expDate}</b></div>` : '';
  const trialBadge = isTrial ? `<div class="trial-badge">🎁 Пробный период</div>` : '';

  const metricsBlock = days < 0
    ? `<div class="expired-card">
        <div class="ei">⚠️</div>
        <h3>Подписка истекла</h3>
        <p>Пополните баланс для продления</p>
        <button class="btn-renew" onclick="renewSub()">💳 Купить подписку</button>
       </div>`
    : `<div class="grid2">
        <div class="card">
          <div class="lbl">Осталось</div>
          <div class="big-num">${days}</div>
          <div class="unit">дней</div>
        </div>
        <div class="card">
          <div class="lbl">Трафик</div>
          <div class="tr-row"><span style="color:var(--muted);font-size:11px">↑ загрузка</span><span>${upStr}</span></div>
          <div class="tr-bar"><div class="tr-fill fill-up" id="bU"></div></div>
          <div class="tr-row" style="margin-top:10px"><span style="color:var(--muted);font-size:11px">↓ скачано</span><span>${dnStr}</span></div>
          <div class="tr-bar"><div class="tr-fill fill-dn" id="bD"></div></div>
        </div>
       </div>`;

  const payHist = payments.length > 0
    ? payments.map(p2 => `
        <div class="pay-item">
          <div class="pay-left">
            <div class="pay-icon" style="background:rgba(0,230,118,.1)">💰</div>
            <div>
              <div style="font-size:13px;font-weight:600">${p2.type || 'Пополнение'}</div>
              <div class="pay-date">${p2.date || ''}</div>
            </div>
          </div>
          <div class="pay-amt">+${p2.amount} ₽</div>
        </div>`).join('')
    : `<div class="empty-hist">📭 История платежей пуста</div>`;

  root.innerHTML = `
    <div class="tabs">
      <button class="tab on" onclick="switchTab('key',this)">🔑 Ключ</button>
      <button class="tab" onclick="switchTab('instr',this)">📖 Инструкция</button>
      <button class="tab" onclick="switchTab('hist',this)">💳 Платежи</button>
    </div>

    <div class="page on" id="pg-key">
      <div class="card">
        <div class="hdr">
          <div class="hdr-left">
            <div class="logo"><img src="logo.png" onerror="this.parentNode.outerHTML='<div class=logo-fb>🛡️</div>'"></div>
            <div>
              <div class="brand">Jimmy VPN</div>
              <div class="status-row">
                <div class="dot ${active?'dot-on':'dot-off'}"></div>
                <span class="status-txt" style="color:${active?'var(--green)':'var(--red)'}">
                  ${active ? 'Активна' : 'Отключена'}
                </span>
              </div>
              ${trialBadge}
              ${expBlock}
            </div>
          </div>
          <div class="bal">${bal} ₽</div>
        </div>
      </div>

      ${metricsBlock}

      <div class="card key-card" id="keyCard">
        <div class="key-top">
          <div class="lbl" style="margin:0">Ссылка подписки</div>
          <div class="key-actions">
            <button class="icon-btn" id="btnEye" onclick="toggleKey(event)" title="Показать/скрыть">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
            <button class="icon-btn" onclick="copyKey(event)" title="Копировать">
              <svg id="icoCopy" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg id="icoDone" style="display:none" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
        </div>
        <div class="key-data" id="keyEl">••••••••••••••••••••••••••••••••••••</div>
      </div>

      <div class="menu">
        <div class="mi mi-accent" onclick="openInV2ray()">
          <div class="mi-left">
            <div class="mi-icon">⚡</div>
            <div>
              <h4>Открыть в v2rayTun</h4>
              <div class="sub">Ключ добавится автоматически</div>
            </div>
          </div>
          <span class="chev">›</span>
        </div>
        <div class="mi" onclick="showQR()">
          <div class="mi-left">
            <div class="mi-icon" style="background:rgba(255,255,255,.06)">📷</div>
            <div><h4>QR-код</h4><div class="sub">Для другого устройства</div></div>
          </div>
          <span class="chev">›</span>
        </div>
        <div class="mi" onclick="copyKey()">
          <div class="mi-left">
            <div class="mi-icon" style="background:rgba(255,255,255,.06)">📋</div>
            <div><h4>Скопировать ссылку</h4></div>
          </div>
          <span class="chev">›</span>
        </div>
        <div class="mi" onclick="renewSub()">
          <div class="mi-left">
            <div class="mi-icon" style="background:rgba(255,193,7,.1)">💳</div>
            <div><h4>Продлить подписку</h4></div>
          </div>
          <span class="chev">›</span>
        </div>

      </div>

      <button class="btn-refresh" onclick="syncData()">
        <svg class="spin" id="syncSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/></svg>
        Обновить данные
      </button>
    </div>

    <div class="page" id="pg-instr">
      <div class="step">
        <div class="step-n">1</div>
        <div class="step-body">
          <h4>Скачайте приложение</h4>
          <p>v2rayTun — лучший клиент для подключения</p>
          <div class="dl-row">
            <button class="dl-btn" onclick="tg.openLink('https://play.google.com/store/apps/details?id=com.v2raytun.android')">🤖 Android</button>
            <button class="dl-btn" onclick="tg.openLink('https://apps.apple.com/app/v2raytun/id6476628951')">🍎 iOS</button>
          </div>
        </div>
      </div>
      <div class="step">
        <div class="step-n">2</div>
        <div class="step-body">
          <h4>Добавьте ключ одним нажатием</h4>
          <p>Перейдите на вкладку <b>«Ключ»</b> → нажмите <b>«Открыть в v2rayTun»</b> — ключ добавится автоматически</p>
        </div>
      </div>
      <div class="step">
        <div class="step-n">3</div>
        <div class="step-body">
          <h4>Или добавьте вручную</h4>
          <p>Скопируйте ссылку подписки → в v2rayTun нажмите <b>«+»</b> → <b>«Из буфера»</b></p>
        </div>
      </div>
      <div class="step">
        <div class="step-n">4</div>
        <div class="step-body">
          <h4>Подключитесь</h4>
          <p>Выберите сервер <b>🇳🇱 Jimmy VPN</b> и нажмите кнопку подключения</p>
        </div>
      </div>
      <div class="step">
        <div class="step-n">5</div>
        <div class="step-body">
          <h4>Другое устройство</h4>
          <p>Нажмите <b>«QR-код»</b> на вкладке Ключ и отсканируйте с другого телефона</p>
        </div>
      </div>
    </div>

    <div class="page" id="pg-hist">
      <div class="card">
        <div class="lbl" style="margin-bottom:12px">История платежей</div>
        ${payHist}
      </div>
      <div class="card" style="text-align:center">
        <div style="font-size:12px;color:var(--muted);margin-bottom:10px">Пополнить баланс</div>
        <button class="btn-renew" onclick="renewSub()" style="margin-top:0">💳 Купить подписку</button>
      </div>
    </div>`;

  // Анимация трафика
  setTimeout(() => {
    const u = document.getElementById('bU'), d = document.getElementById('bD');
    if(u) u.style.width = '60%';
    if(d) d.style.width = '35%';
  }, 400);
}

// ── Функции ──────────────────────────────────────────────

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  if(el) el.classList.add('on');
  ['key','instr','hist'].forEach(n => {
    const pg = document.getElementById('pg-'+n);
    if(pg) pg.classList.toggle('on', n===name);
  });
  try{ tg.HapticFeedback.selectionChanged(); }catch(e){}
}

let keyVisible = false;
function toggleKey(e) {
  if(e) e.stopPropagation();
  if(!sub) return;
  keyVisible = !keyVisible;
  const el = document.getElementById('keyEl');
  const btn = document.getElementById('btnEye');
  if(keyVisible) {
    el.textContent = sub;
    el.classList.add('revealed');
    btn.style.opacity = '1';
  } else {
    el.textContent = '••••••••••••••••••••••••••••••••••••';
    el.classList.remove('revealed');
    btn.style.opacity = '.5';
  }
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
}

function copyKey(e) {
  if(e) e.stopPropagation();
  if(!sub) return;
  // Показываем ключ на секунду
  const el = document.getElementById('keyEl');
  const c1 = document.getElementById('icoCopy'), c2 = document.getElementById('icoDone');
  if(!keyVisible && el){ el.textContent = sub; el.classList.add('revealed'); }
  if(c1) c1.style.display='none'; if(c2) c2.style.display='block';
  function fb(){
    try{
      const t=document.createElement('textarea');
      t.value=sub;t.style.position='fixed';t.style.opacity='0';
      document.body.appendChild(t);t.focus();t.select();
      document.execCommand('copy');document.body.removeChild(t);
    }catch(e){}
  }
  const ok = () => {
    try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    showToast('✓ Скопировано');
    setTimeout(() => {
      if(!keyVisible && el){ el.textContent='••••••••••••••••••••••••••••••••••••'; el.classList.remove('revealed'); }
      if(c1)c1.style.display='block'; if(c2)c2.style.display='none';
    }, 2000);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(sub).then(ok).catch(()=>{fb();ok();});
  } else { fb(); ok(); }
}

function openInV2ray() {
  if(!sub) return;
  try{ tg.HapticFeedback.impactOccurred('medium'); }catch(e){}
  // Пробуем несколько способов открыть v2rayTun
  const link = document.createElement('a');
  link.href = 'v2rayng://install-config?url=' + encodeURIComponent(sub);
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('📡 Открываем в v2rayTun...');
}

let _qrDone = false;
function showQR() {
  if(!sub) return;
  if(!_qrDone){
    new QRCode(document.getElementById('qrcode'),{
      text:sub, width:200, height:200,
      colorDark:'#000', colorLight:'#fff',
      correctLevel: QRCode.CorrectLevel.M
    });
    _qrDone = true;
  }
  document.getElementById('qrOverlay').classList.add('show');
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
}
function hideQR(){ document.getElementById('qrOverlay').classList.remove('show'); }

function renewSub(){
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
  tg.sendData('renew');
}

function openSupport(){
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
  // Закрываем WebApp и открываем бота — пользователь попадёт в диалог с ботом
  tg.close();
}

function syncData(){
  const s = document.getElementById('syncSvg');
  if(s) s.classList.add('spinning');
  try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
  setTimeout(()=>{
    if(s) s.classList.remove('spinning');
    tg.sendData('refresh');
  }, 600);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
</script>
