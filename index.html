<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(10, 11, 14, 0.75);
            --border: #181a21;
            --border-hover: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-secondary: #6e727f;
            --success: #27ae60;
            --danger: #e74c3c;
            --blue: #2980b9;
            --accent: #5b5ef4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start;
            overflow-x: hidden; position: relative; perspective: 1000px; }

        #bg-glow {
            position: fixed; width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(255,255,255,.1) 0%, rgba(255,255,255,.03) 40%, transparent 70%);
            top: -140px; left: -140px; pointer-events: none; z-index: -1; border-radius: 50%;
            will-change: transform; transition: opacity .6s; opacity: 0;
        }

        .wrapper { width: 100%; max-width: 400px; padding: 24px 16px;
            display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }

        .card { background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 16px; padding: 16px; backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            transition: transform .4s cubic-bezier(.25,1,.5,1), border-color .3s; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 40px; height: 40px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
        .logo-img img { width: 100%; height: 100%; object-fit: cover; }
        .logo-emoji { width: 40px; height: 40px; border-radius: 10px; background: #111;
            border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .brand { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
        .status-block { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-on { background: var(--success); box-shadow: 0 0 6px var(--success); animation: blink 2s infinite; }
        .dot-off { background: var(--danger); }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
        .status-text { font-size: 12px; font-weight: 500; letter-spacing: .2px; }
        .balance-text { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

        /* Expires date */
        .expires-badge { display: inline-flex; align-items: center; gap: 5px;
            background: rgba(255,255,255,.04); border: 1px solid #222;
            border-radius: 8px; padding: 6px 10px; font-size: 12px;
            color: var(--text-secondary); margin-top: 10px; }
        .expires-badge b { color: var(--text-main); }

        /* Expired block */
        .expired-block { background: rgba(231,76,60,.07); border: 1px solid rgba(231,76,60,.2);
            border-radius: 14px; padding: 16px; text-align: center; }
        .expired-block .exp-icon { font-size: 32px; margin-bottom: 8px; }
        .expired-block h3 { font-size: 15px; font-weight: 700; color: var(--danger); margin-bottom: 6px; }
        .expired-block p { font-size: 13px; color: var(--text-secondary); }
        .btn-renew { width: 100%; margin-top: 12px; padding: 13px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none; color: #fff; border-radius: 12px;
            font-size: 14px; font-weight: 700; cursor: pointer; }

        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .label { font-size: 10px; color: var(--text-secondary); text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 8px; font-weight: 600; }
        .value { font-size: 22px; font-weight: 700; letter-spacing: -.5px; margin-top: 6px; }
        .traffic-item { display: flex; justify-content: space-between; font-size: 13px;
            font-weight: 500; margin-top: 6px; }
        .traffic-val { font-variant-numeric: tabular-nums; font-weight: 700; }
        .traffic-bar { height: 3px; border-radius: 100px; margin-top: 6px;
            background: rgba(255,255,255,.06); overflow: hidden; }
        .tb-fill { height: 100%; border-radius: 100px; width: 0;
            transition: width 1s cubic-bezier(.34,1.2,.64,1); }
        .tb-up { background: linear-gradient(90deg,#2980b9,#5dade2); }
        .tb-dn { background: linear-gradient(90deg,#27ae60,#58d68d); }

        /* Token */
        .token-zone { cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .token-left { width: 85%; }
        .token-data { font-family: ui-monospace, monospace; font-size: 12px;
            color: var(--text-secondary); white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; margin-top: 4px; transition: color .2s; }
        .token-revealed { color: var(--text-main); }
        .icon-action { width: 24px; height: 24px; opacity: .5; display: flex;
            align-items: center; justify-content: center; transition: opacity .2s; }

        /* Menu */
        .menu-list { display: flex; flex-direction: column; gap: 8px; }
        .menu-item { display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 14px; backdrop-filter: blur(25px); cursor: pointer;
            transition: transform .3s, border-color .2s; }
        .menu-item:active { border-color: var(--border-hover); background: rgba(255,255,255,.02); }
        .menu-left { display: flex; align-items: center; gap: 12px; }
        .menu-left svg { stroke: var(--text-secondary); flex-shrink: 0; }
        .menu-item h4 { font-size: 14px; font-weight: 500; }
        .menu-item .sub-text { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .chevron { stroke: #33363f; flex-shrink: 0; }

        /* V2ray highlight button */
        .menu-item.accent { border-color: rgba(91,94,244,.3); background: rgba(91,94,244,.07); }
        .menu-item.accent h4 { color: #a5a7ff; }
        .menu-item.accent svg { stroke: #a5a7ff; }
        .menu-item.accent .chevron { stroke: rgba(91,94,244,.4); }

        .btn-update { background: none; border: 1px solid var(--border); color: var(--text-secondary);
            border-radius: 12px; padding: 13px; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            gap: 8px; width: 100%; transition: background .2s, color .2s, border-color .2s; }
        .btn-update:active { background: var(--card-bg); color: var(--text-main); border-color: var(--border-hover); }

        /* Toast */
        .toast { position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(39,174,96,.1); backdrop-filter: blur(12px);
            border: 1px solid rgba(39,174,96,.2); color: var(--success);
            padding: 11px 22px; border-radius: 100px; font-size: 13px; font-weight: 600;
            transition: transform .35s cubic-bezier(.34,1.56,.64,1);
            white-space: nowrap; z-index: 999; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* No key — stranger screen */
        .stranger { min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 32px 24px; text-align: center; }
        .stranger-glow { width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, rgba(231,76,60,.25) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            font-size: 52px; margin-bottom: 24px; animation: pulse 3s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
        .stranger h1 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
        .stranger p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; max-width: 280px; }
        .stranger-steps { margin: 24px 0; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
        .step { display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,.03); border: 1px solid #1a1a1a;
            border-radius: 12px; padding: 12px 14px; text-align: left; }
        .step-num { width: 24px; height: 24px; border-radius: 50%;
            background: rgba(255,255,255,.06); border: 1px solid #2a2a2a;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: var(--text-secondary); flex-shrink: 0; }
        .step span { font-size: 13px; color: var(--text-secondary); }
        .step b { color: var(--text-main); }
        .btn-open-bot { width: 100%; max-width: 300px; padding: 15px;
            background: linear-gradient(135deg, #2980b9, #5dade2);
            border: none; color: #fff; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px;
            box-shadow: 0 4px 20px rgba(41,128,185,.3); }

        .icon-spin { transition: transform .5s ease; }
        .spinning { transform: rotate(360deg); }
    </style>
</head>
<body>
<div id="bg-glow"></div>
<div class="wrapper" id="root"></div>
<div class="toast" id="toast">✓ Скопировано</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand(); tg.ready();

const p = new URLSearchParams(window.location.search);
const sub    = p.get('sub') || '';
const days   = parseInt(p.get('days') ?? '-1');
const upStr  = p.get('up')   || '0 Б';
const dnStr  = p.get('down') || '0 Б';
const active = p.get('active') === '1';
const bal    = p.get('balance') || '0';
const expDate = p.get('exp') || '';
const root   = document.getElementById('root');

// Определяем — открыто через бота или напрямую
const isFromBot = tg.initData && tg.initData.length > 0;

if (!sub) {
    // Красивый экран для тех кто открыл не через бота
    root.innerHTML = `
        <div class="stranger">
            <div class="stranger-glow">🔒</div>
            <h1>${isFromBot ? 'Ключ не найден' : 'Доступ закрыт'}</h1>
            <p>${isFromBot
                ? 'У вас ещё нет активного ключа.<br>Оформите подписку в боте.'
                : 'Это личный кабинет сервиса<br><b>Jimmy VPN</b>.<br>Открывайте его только через бот.'
            }</p>
            <div class="stranger-steps">
                <div class="step">
                    <div class="step-num">1</div>
                    <span>Откройте <b>@Jimmy_Vpn_bot</b></span>
                </div>
                <div class="step">
                    <div class="step-num">2</div>
                    <span>Нажмите <b>👤 Личный кабинет</b></span>
                </div>
                <div class="step">
                    <div class="step-num">3</div>
                    <span>Нажмите <b>📡 Подключить в Happ</b></span>
                </div>
            </div>
            <button class="btn-open-bot" onclick="tg.close()">
                ${isFromBot ? '← Вернуться в бот' : '← Открыть бот'}
            </button>
        </div>`;
} else {
    // Блок даты окончания
    const expBlock = expDate
        ? `<div class="expires-badge">📅 До <b>${expDate}</b></div>`
        : '';

    // Блок истекла / дней осталось
    const daysBlock = days < 0
        ? `<div class="expired-block">
            <div class="exp-icon">⚠️</div>
            <h3>Подписка истекла</h3>
            <p>Пополните баланс для продления</p>
            <button class="btn-renew" onclick="tg.close()">💳 Купить подписку</button>
           </div>`
        : `<div class="metrics-grid">
            <div class="card tilt">
                <div class="label">Осталось</div>
                <div class="value">${days}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:3px">дней</div>
            </div>
            <div class="card tilt">
                <div class="label">Трафик</div>
                <div class="traffic-item">
                    <span style="color:var(--text-secondary)">↑</span>
                    <span class="traffic-val">${upStr}</span>
                </div>
                <div class="traffic-bar"><div class="tb-fill tb-up" id="bU"></div></div>
                <div class="traffic-item" style="margin-top:8px">
                    <span style="color:var(--text-secondary)">↓</span>
                    <span class="traffic-val">${dnStr}</span>
                </div>
                <div class="traffic-bar"><div class="tb-fill tb-dn" id="bD"></div></div>
            </div>
           </div>`;

    root.innerHTML = `
        <div class="card header tilt">
            <div class="header-left">
                <div class="logo-img">
                    <img src="logo.png" onerror="this.parentNode.outerHTML='<div class=logo-emoji>🛡️</div>'">
                </div>
                <div>
                    <div class="brand">Jimmy VPN</div>
                    <div class="status-block">
                        <div class="status-dot ${active ? 'dot-on':'dot-off'}"></div>
                        <span class="status-text" style="color:${active ? 'var(--success)':'var(--danger)'}">
                            ${active ? 'Подписка активна' : 'Подписка отключена'}
                        </span>
                    </div>
                    ${expBlock}
                </div>
            </div>
            <div class="balance-text">${bal} ₽</div>
        </div>

        ${daysBlock}

        <div class="card token-zone tilt" onclick="copyKey()">
            <div class="token-left">
                <div class="label">Ссылка подписки</div>
                <div class="token-data" id="keyEl">••••••••••••••••••••••••••••••••••••</div>
            </div>
            <div class="icon-action">
                <svg id="icoCopy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <svg id="icoDone" style="display:none" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
        </div>

        <div class="menu-list">
            <div class="menu-item accent tilt" onclick="openInV2ray()">
                <div class="menu-left">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
                    <div>
                        <h4>Открыть в v2rayNG</h4>
                        <div class="sub-text">Ключ добавится автоматически</div>
                    </div>
                </div>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="menu-item tilt" onclick="copyKey()">
                <div class="menu-left">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <h4>Скопировать ссылку</h4>
                </div>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="menu-item tilt" onclick="tg.openLink('https://play.google.com/store/apps/details?id=com.v2ray.ang')">
                <div class="menu-left">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                    <h4>Скачать v2rayNG</h4>
                </div>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="menu-item tilt" onclick="renewSub()">
                <div class="menu-left">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
                    <h4>Продлить подписку</h4>
                </div>
                <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
        </div>

        <button class="btn-update" onclick="syncData()">
            <svg class="icon-spin" id="syncSvg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/></svg>
            Обновить данные
        </button>`;

    // Анимация трафика
    setTimeout(() => {
        const u = document.getElementById('bU'), d = document.getElementById('bD');
        if(u) u.style.width='65%'; if(d) d.style.width='40%';
    }, 600);

    // Интерактивный фон
    const glow = document.getElementById('bg-glow');
    const targets = document.querySelectorAll('.tilt');
    let mx=0,my=0,cx=0,cy=0;
    (function loop(){ cx+=(mx-cx)*.05; cy+=(my-cy)*.05;
        glow.style.transform=`translate3d(${cx-140}px,${cy-140}px,0)`; requestAnimationFrame(loop); })();
    function move(e){ glow.style.opacity='1';
        const px=e.touches?e.touches[0].clientX:e.clientX, py=e.touches?e.touches[0].clientY:e.clientY;
        mx=px; my=py;
        targets.forEach(c=>{ const r=c.getBoundingClientRect();
            const ax=-(py-(r.top+r.height/2))/(r.height/2)*2, ay=(px-(r.left+r.width/2))/(r.width/2)*2;
            c.style.transform=`rotateX(${ax}deg) rotateY(${ay}deg) scale3d(1.005,1.005,1.005)`;
            c.style.borderColor='rgba(255,255,255,.08)'; }); }
    function leave(){ glow.style.opacity='0';
        targets.forEach(c=>{ c.style.transform=''; c.style.borderColor='var(--border)'; }); }
    window.addEventListener('mousemove',move);
    window.addEventListener('touchmove',move,{passive:true});
    window.addEventListener('mouseleave',leave);
    window.addEventListener('touchend',leave);
}

function openInV2ray(){
    if(!sub) return;
    try{ tg.HapticFeedback.impactOccurred('medium'); }catch(e){}
    // deep link — откроет v2rayNG и сразу добавит подписку
    const deepLink = 'v2rayng://install-config?url=' + encodeURIComponent(sub);
    tg.openLink(deepLink);
    showToast('📡 Открываем в v2rayNG...');
}

function copyKey(){
    if(!sub) return;
    const el=document.getElementById('keyEl');
    const c1=document.getElementById('icoCopy'), c2=document.getElementById('icoDone');
    if(el){ el.textContent=sub; el.classList.add('token-revealed'); }
    if(c1) c1.style.display='none'; if(c2) c2.style.display='block';
    const ok=()=>{
        try{ tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
        showToast('✓ Скопировано');
        setTimeout(()=>{
            if(el){el.textContent='••••••••••••••••••••••••••••••••••••';el.classList.remove('token-revealed');}
            if(c1)c1.style.display='block'; if(c2)c2.style.display='none';
        },2000);
    };
    function fb(){
        try{
            const t=document.createElement('textarea');
            t.value=sub; t.style.position='fixed'; t.style.opacity='0';
            document.body.appendChild(t); t.focus(); t.select();
            document.execCommand('copy'); document.body.removeChild(t);
        }catch(e){}
    }
    if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(sub).then(ok).catch(()=>{fb();ok();});
    } else { fb(); ok(); }
}

function renewSub(){
    try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
    tg.close();
}

function syncData(){
    const s=document.getElementById('syncSvg');
    if(s){ s.classList.add('spinning'); }
    try{ tg.HapticFeedback.impactOccurred('light'); }catch(e){}
    setTimeout(()=>{
        if(s) s.classList.remove('spinning');
        tg.sendData('refresh');
    }, 500);
}

function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent = msg || '✓ OK';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
}
</script>
</body>
</html>
